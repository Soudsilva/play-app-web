<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="/pwa-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Diversões</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f2a66">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Play">
    <link rel="apple-touch-icon" href="assets/img/logomenor.png">
    <style>
        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f2a66;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .encerramento {
            width: min(100% - 40px, 420px);
        }

        .logo {
            width: min(220px, 70vw);
            margin-bottom: 34px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.3;
        }

        .app-versao {
            position: fixed;
            right: 20px;
            bottom: 14px;
            color: #526898;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="encerramento">
        <img class="logo" src="assets/img/logo.png" alt="Play Diversões">
        <h1>App descontinuado</h1>
    </main>
    <div class="app-versao">V 4.3</div>
</body>
</html>
