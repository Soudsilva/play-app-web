<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="/pwa-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de Compra</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .topo,
        .titulo,
        .btn-home,
        .card-accent,
        .badges-col,
        .badge-cat,
        .badge-tempo,
        .nome-sol,
        .card-acoes,
        .btn-acao,
        .btn-excluir,
        .form-fixo-topo,
        .form-fixo-titulo,
        .form-fixo-categoria,
        .chips-cat,
        .chip-cat,
        .campo-direcionamento,
        .campo-direcionamento label,
        #btnCancelar,
        #btnEnviar,
        .estado-vazio {
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f2a66;
            display: flex;
            justify-content: center;
            color: white;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 440px;
            padding: 15px 18px 200px;
        }

        /* ── TOPO ── */
        .topo {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 6px 64px 4px 32px;
            margin-bottom: 14px;
        }
        .titulo-wrap { text-align: center; }
        .titulo { font-size: 28px; font-weight: bold; letter-spacing: 0.3px; white-space: nowrap; color: #ffffff; }
        .titulo-tipo.produtos { color: #4caf50; }
        .titulo-tipo.peca { color: #ff9800; }
        .subtitulo {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9db8e8;
            margin-top: 2px;
        }
        .btn-home {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            cursor: pointer;
            background: rgba(255,255,255,0.12);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.22);
        }
        .btn-home:active { background: rgba(255,255,255,0.28); transform: translateY(-50%) scale(0.92); }
        .btn-home img { width: 22px; height: 22px; filter: brightness(0) invert(1); }

        /* ── CARDS ── */
        .card-pedido {
            background: linear-gradient(160deg, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.05) 100%);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 20px;
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: 0 10px 28px rgba(0,0,0,0.22);
            backdrop-filter: blur(8px);
            transition: transform 0.15s;
        }
        .card-pedido:active { transform: scale(0.985); }
        .card-pedido.destacar-salvo {
            border-color: #ffeb3b;
            box-shadow: 0 0 0 2px #ffeb3b, 0 10px 28px rgba(0,0,0,0.22);
        }

        /* Barra de urgência no topo do card */
        .card-accent {
            height: 6px;
            width: 100%;
        }
        .accent-produtos  { background: linear-gradient(90deg, #4caf50, #81c784); }
        .accent-peca      { background: linear-gradient(90deg, #ff9800, #ffb74d); }

        /* Urgência sobrescreve a cor */
        .urgencia-alta  .card-accent { background: linear-gradient(90deg, #f44336, #ef9a9a) !important; }
        .urgencia-media .card-accent { background: linear-gradient(90deg, #ff9800, #ffcc80) !important; }

        .card-corpo { padding: 13px 16px 12px; }

        /* Topo do card: categoria discreta acima da descrição */
        .card-topo {
            margin-bottom: 10px;
        }

        .desc-item {
            font-size: 20px;
            font-weight: 700;
            color: white;
            word-break: break-word;
            line-height: 1.3;
            flex: 1;
            -webkit-user-select: none;
            user-select: none;
        }

        .badges-col {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 7px;
            width: 100%;
            min-width: 0;
            margin-bottom: 6px;
        }

        .badge-cat {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .badge-produtos { background: rgba(76,175,80,0.25);  border: 1.5px solid #4caf50; color: #c8e6c9; }
        .badge-peca     { background: rgba(255,152,0,0.25);  border: 1.5px solid #ff9800; color: #ffe0b2; }

        .responsavel-estoque {
            margin-left: auto;
            max-width: 70%;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: right;
            color: #dce8fa;
            font-size: 12px;
            font-weight: 700;
            line-height: 21px;
        }

        .badge-tempo {
            font-size: 12px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 999px;
            white-space: nowrap;
            letter-spacing: 0.1px;
            border: 1px solid transparent;
        }
        .tempo-hoje   { background: rgba(76,175,80,0.20);  border-color: rgba(76,175,80,0.36);  color: #d5f2d8; }
        .tempo-fresco { background: rgba(33,150,243,0.20); border-color: rgba(33,150,243,0.36); color: #d4e9ff; }
        .tempo-alerta { background: rgba(255,152,0,0.20);  border-color: rgba(255,152,0,0.38);  color: #fff0d5; }
        .tempo-urgente{ background: rgba(244,67,54,0.20);  border-color: rgba(244,67,54,0.38);  color: #ffe0e2; }

        /* Rodapé: metadados à esquerda e ações exclusivamente à direita */
        .card-rodape {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.18);
            padding-top: 8px;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }
        .nome-sol {
            font-size: 14px;
            color: #dde8ff;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .meta-separador {
            color: rgba(221,232,255,0.58);
            flex-shrink: 0;
        }
        .card-meta .badge-tempo { flex-shrink: 0; }

        .card-acoes {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .btn-acao {
            width: 40px;
            height: 40px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: not-allowed;
            color: #b9c8e6;
            border-radius: 50%;
            transition: 0.15s;
            opacity: 0.4;
            flex-shrink: 0;
        }
        .btn-acao.ativo-editar  { opacity: 1; cursor: pointer; color: #a8cdfa; }
        .btn-acao.ativo-editar:active  { background: rgba(33,150,243,0.2); }
        .btn-acao.ativo-confirmar { opacity: 1; cursor: pointer; color: #a9dfb2; }
        .btn-acao.ativo-confirmar:active { background: rgba(76,175,80,0.28); }

        .btn-excluir {
            width: 40px;
            height: 40px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #ffafb3;
            border-radius: 50%;
            transition: 0.15s;
            flex-shrink: 0;
        }
        .btn-excluir:active { background: rgba(244,67,54,0.35); }
        .icone-acao {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .icone-lixeira { font-size: 18px; line-height: 1; }
        .icone-confirmar { font-size: 18px; line-height: 1; }

        /* ── FORM FIXO ── */
        .form-fixo {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            background: rgba(5, 20, 60, 0.96);
            border-top: 2px solid rgba(255,235,59,0.5);
            padding: 14px 18px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.45);
            backdrop-filter: blur(18px);
            z-index: 100;
        }
        @media (min-width: 441px) {
            .form-fixo { left: 50%; transform: translateX(-50%); max-width: 440px; }
        }

        .form-fixo-topo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .form-fixo-titulo {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffeb3b;
            text-align: center;
        }
        .form-fixo-categoria {
            min-width: 88px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .form-fixo-categoria.vazia {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.18);
            color: #9fb4d7;
        }
        .form-fixo-categoria.produtos {
            background: rgba(76,175,80,0.18);
            border-color: rgba(76,175,80,0.55);
            color: #bfe5c4;
        }
        .form-fixo-categoria.peca {
            background: rgba(255,152,0,0.18);
            border-color: rgba(255,152,0,0.55);
            color: #ffd79b;
        }

        .input-glass {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.09);
            color: white;
            font-size: 17px;
            outline: none;
        }
        .input-glass::placeholder { color: #7a9cc8; }
        .input-glass:focus { border-color: #ffeb3b; background: rgba(255,255,255,0.12); }

        .campo-direcionamento {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .campo-direcionamento[hidden] { display: none; }
        .campo-direcionamento label {
            align-self: center;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #c9d9f3;
        }
        .select-glass {
            width: 100%;
            min-height: 42px;
            padding: 10px 38px 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.09);
            color: #ffffff;
            font: inherit;
            font-size: 15px;
            outline: none;
        }
        .select-glass:focus { border-color: #ffeb3b; background: rgba(255,255,255,0.12); }
        .select-glass option { color: #10285c; }

        .linha-categoria-direcionamento {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(142px, 1fr);
            align-items: end;
            gap: 8px;
        }
        .linha-categoria-direcionamento.sem-direcionamento { grid-template-columns: 1fr; }

        .card-direcionamento {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
            color: #c9d9f3;
            font-size: 12px;
            line-height: 1.25;
        }
        .card-direcionamento strong { color: #ffffff; }

        /* Linha única: chips de categoria + botão enviar */
        .linha-enviar {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .linha-enviar .input-glass {
            flex: 1;
            margin: 0;
        }
        .chips-cat {
            display: flex;
            gap: 6px;
            position: relative;
            overflow: visible;
            padding-top: 6px;
        }
        .chip-cat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
            border: 1.5px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.06);
            color: #8aadde;
            transition: 0.15s;
            -webkit-user-select: none;
            user-select: none;
        }
        .chip-cat .chip-label {
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }
        .chip-cat[data-val="peca"] .chip-label { color: #ffcc80; }
        .chip-cat[data-val="produtos"] .chip-label { color: #a5d6a7; }
        .chip-cat.selecionado-produtos {
            border-color: #4caf50;
            background: rgba(76,175,80,0.22);
            color: #a5d6a7;
            transform: translateY(-5px) scale(1.07);
            box-shadow: 0 6px 18px rgba(76,175,80,0.55), 0 2px 0 #4caf50;
            border-bottom-width: 3px;
            border-bottom-color: #4caf50;
            z-index: 2;
        }
        .chip-cat.selecionado-peca {
            border-color: #ff9800;
            background: rgba(255,152,0,0.22);
            color: #ffcc80;
            transform: translateY(-5px) scale(1.07);
            box-shadow: 0 6px 18px rgba(255,152,0,0.55), 0 2px 0 #ff9800;
            border-bottom-width: 3px;
            border-bottom-color: #ff9800;
            z-index: 2;
        }
        .chip-cat:active { transform: scale(0.96); }

        #btnCancelar {
            display: none;
            background: rgba(244,67,54,0.2);
            color: #ffcdd2;
            border: 1.5px solid #f44336;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: -4px;
        }

        #btnEnviar {
            background: linear-gradient(135deg, #ffeb3b, #ffc107);
            color: #0f2a66;
            font-weight: bold;
            font-size: 16px;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        #btnEnviar:disabled {
            cursor: not-allowed;
            opacity: 0.45;
            filter: saturate(0.45);
        }
        #btnEnviar:active { transform: scale(0.97); }

        /* ── VAZIO ── */
        .estado-vazio {
            text-align: center;
            padding: 50px 20px;
            color: #7a9cc8;
        }
        .estado-vazio .icone-vazio { font-size: 48px; margin-bottom: 12px; }
        .estado-vazio p { font-size: 17px; margin: 0; }

        input[type="hidden"] { display: none; }
    </style>
</head>
<body>

<div class="app">
    <div class="topo">
        <div class="titulo-wrap">
            <div class="titulo" id="tituloPedidos">Pedidos</div>
        </div>
        <div class="btn-home" onclick="window.location.href='index.html'">
            <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Home">
        </div>
    </div>

    <div id="listaPedidos">
        <div class="estado-vazio">
            <div class="icone-vazio">🛒</div>
            <p>Carregando pedidos...</p>
        </div>
    </div>
</div>

<!-- Formulário Fixo -->
<div class="form-fixo">
    <div class="form-fixo-topo">
        <div class="form-fixo-titulo">Novo Pedido</div>
        <div id="formCategoriaAtual" class="form-fixo-categoria vazia" style="display:none">Selecione</div>
    </div>
    <button id="btnCancelar" onclick="cancelarEdicao()">✕ Cancelar edição</button>
    <input type="hidden" id="idPedido">

    <div class="linha-categoria-direcionamento" id="linhaCategoriaDirecionamento">
        <div class="chips-cat" id="chipsCat">
            <div class="chip-cat selecionado-peca" data-val="peca" onclick="selecionarCat('peca')"><span class="chip-label">Outros / Peças</span></div>
            <div class="chip-cat" data-val="produtos" onclick="selecionarCat('produtos')"><span class="chip-label">Produtos</span></div>
        </div>

        <div class="campo-direcionamento" id="campoDirecionamento">
            <select class="select-glass" id="direcionadoPara" aria-label="Aos cuidados de" required>
                <option value="">A/C</option>
            </select>
        </div>
    </div>

    <div class="linha-enviar">
        <input class="input-glass" type="text" id="descPedido" placeholder="O que precisa comprar?">
        <button id="btnEnviar" onclick="salvarPedido()">ENVIAR</button>
    </div>
</div>

<script src="assets/js/play-dialogs.js"></script>
<script type="module">
    import { verificarAutenticacao } from './auth.js';
    verificarAutenticacao();
    import { dbSalvarPedido, dbEscutarPedidos, dbExcluirPedido } from './database.js';

    const usuarioLogado = localStorage.getItem('usuarioLogado') || "Desconhecido";

    const _cacheColab = localStorage.getItem('cache_colaboradores');
    const _listaColab = _cacheColab ? JSON.parse(_cacheColab) : [];
    const _usuarioObj = _listaColab.find(c => c.nome === usuarioLogado);
    const _perfilUsuario = String(_usuarioObj?.nivel_completo || '').toLowerCase();
    const isGestor = _perfilUsuario.includes('gestao');
    const isEstoqueNivel1 = _perfilUsuario.includes('estoque_1') || _perfilUsuario.includes('estoque nivel 1');

    // Categoria selecionada no form
    let catAtual = 'peca';
    let pedidoRecemSalvo = null;

    function perfilPodeReceberPedido(colaborador) {
        const perfil = String(colaborador?.nivel_completo || '').toLowerCase();
        return perfil.includes('atendimento_2') || perfil.includes('gestao_3');
    }

    function preencherResponsaveisPedido() {
        const select = document.getElementById('direcionadoPara');
        if (!select) return;

        const responsaveis = (Array.isArray(_listaColab) ? _listaColab : [])
            .filter(perfilPodeReceberPedido)
            .map(colaborador => String(colaborador?.nome || '').trim())
            .filter(Boolean)
            .sort((a, b) => b.localeCompare(a, 'pt-BR'));

        select.innerHTML = '<option value="">A/C</option>';
        responsaveis.forEach(nome => {
            const option = document.createElement('option');
            option.value = nome;
            option.textContent = nome;
            select.appendChild(option);
        });

        if (responsaveis.length === 0) {
            select.options[0].textContent = 'Nenhum responsável disponível';
            select.disabled = true;
        }
    }

    function atualizarCampoDirecionamento() {
        const campo = document.getElementById('campoDirecionamento');
        const select = document.getElementById('direcionadoPara');
        const linha = document.getElementById('linhaCategoriaDirecionamento');
        const ehPedidoDePeca = catAtual === 'peca';
        if (!campo || !select) return;
        campo.hidden = !ehPedidoDePeca;
        select.required = ehPedidoDePeca;
        linha?.classList.toggle('sem-direcionamento', !ehPedidoDePeca);
        if (!ehPedidoDePeca) select.value = '';
        atualizarEstadoBotaoEnviar();
    }

    function atualizarEstadoBotaoEnviar() {
        const botao = document.getElementById('btnEnviar');
        const responsavel = document.getElementById('direcionadoPara')?.value || '';
        const descricao = document.getElementById('descPedido')?.value.trim() || '';
        if (!botao) return;
        botao.disabled = !descricao || (catAtual === 'peca' && !responsavel);
    }

    function atualizarCategoriaTituloForm() {
        const categoriaEl = document.getElementById('formCategoriaAtual');
        if (!categoriaEl) return;
        const rotulos = {
            produtos: 'Produtos',
            peca: 'Peças',
        };
        categoriaEl.className = `form-fixo-categoria ${catAtual || 'vazia'}`;
        categoriaEl.textContent = rotulos[catAtual] || 'Selecione';
        const tituloPedidos = document.getElementById('tituloPedidos');
        if (tituloPedidos) {
            tituloPedidos.className = 'titulo';
            tituloPedidos.innerHTML = catAtual
                ? `Pedidos <span class="titulo-tipo ${catAtual}">${rotulos[catAtual]}</span>`
                : 'Pedidos';
        }
        atualizarCampoDirecionamento();
    }
    window.selecionarCat = function(val) {
        catAtual = val;
        document.querySelectorAll('.chip-cat').forEach(c => {
            c.className = 'chip-cat';
            if (c.dataset.val === val) c.classList.add('selecionado-' + val);
        });
        atualizarCategoriaTituloForm();
        aplicarFiltroCategoria();
    };
    selecionarCat('peca');

    function limparSelecaoCategoria() {
        catAtual = '';
        document.querySelectorAll('.chip-cat').forEach(c => {
            c.className = 'chip-cat';
        });
        atualizarCategoriaTituloForm();
        aplicarFiltroCategoria();
    }

    function aplicarFiltroCategoria() {
        const container = document.getElementById('listaPedidos');
        const cards = Array.from(document.querySelectorAll('.card-pedido'));
        let totalVisivel = 0;

        cards.forEach(card => {
            const categoria = card.dataset.cat || '';
            const exibir = !catAtual || categoria === catAtual;
            card.style.display = exibir ? '' : 'none';
            if (exibir) totalVisivel += 1;
        });

        const estadoExistente = document.getElementById('estadoVazioFiltro');
        if (cards.length === 0) return;
        if (totalVisivel > 0) {
            estadoExistente?.remove();
            return;
        }

        const estado = estadoExistente || document.createElement('div');
        estado.id = 'estadoVazioFiltro';
        estado.className = 'estado-vazio';
        estado.innerHTML = `
            <div class="icone-vazio">📭</div>
            <p>${catAtual === 'peca'
                ? 'Nenhum pedido de peças direcionado a você.'
                : 'Nenhum pedido de produtos pendente.'}</p>`;
        if (!estadoExistente) container.appendChild(estado);
    }

    function calcularDias(dataIso) {
        if (!dataIso) return 0;
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const d    = new Date(dataIso); d.setHours(0,0,0,0);
        return Math.max(0, Math.floor((hoje - d) / 86400000));
    }

    function timestampPedido(pedido) {
        const ts = Date.parse(pedido?.data || '');
        return Number.isNaN(ts) ? 0 : ts;
    }

    function txtDias(dias) {
        return dias === 1 ? 'há 1 dia' : `há ${dias} dias`;
    }

    function badgeTempo(dias, media) {
        if (dias === 0)          return { cls: 'tempo-hoje',    txt: 'Hoje' };
        if (dias <= media * 0.5) return { cls: 'tempo-fresco',  txt: txtDias(dias) };
        if (dias <= media)       return { cls: 'tempo-alerta',  txt: txtDias(dias) };
        return                          { cls: 'tempo-urgente', txt: txtDias(dias) };
    }

    function urgenciaClass(dias, media) {
        if (dias > media)        return 'urgencia-alta';
        if (dias > media * 0.5)  return 'urgencia-media';
        return '';
    }

    function inicialAvatar(nome) {
        return (nome || '?').trim().charAt(0).toUpperCase();
    }

    function normalizarTextoPedido(valor) {
        return String(valor || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .trim();
    }

    preencherResponsaveisPedido();
    document.getElementById('direcionadoPara')?.addEventListener('change', atualizarEstadoBotaoEnviar);
    document.getElementById('descPedido')?.addEventListener('input', atualizarEstadoBotaoEnviar);

    // 1. CARREGAR PEDIDOS
    dbEscutarPedidos((lista) => {
        const container = document.getElementById('listaPedidos');
        container.innerHTML = '';

        if (lista.length === 0) {
            container.innerHTML = `
                <div class="estado-vazio">
                    <div class="icone-vazio">✅</div>
                    <p>Tudo comprado! Nenhum pedido pendente.</p>
                </div>`;
            return;
        }

        const todosDias = lista.map(p => calcularDias(p.data));
        const media = todosDias.length ? todosDias.reduce((a, b) => a + b, 0) / todosDias.length : 7;

        let cardRecemSalvo = null;
        let totalCardsRenderizados = 0;
        lista.slice().sort((a, b) => timestampPedido(a) - timestampPedido(b)).forEach(p => {
            const dias = calcularDias(p.data);
            const tempo = badgeTempo(dias, media);
            const urgencia = urgenciaClass(dias, media);
            const souDono = (p.solicitante === usuarioLogado);
            const foiDirecionado = normalizarTextoPedido(p.direcionadoPara) === normalizarTextoPedido(usuarioLogado);
            const pedidoAutomatico = normalizarTextoPedido(p.solicitante) === 'pedido automatico';
            const podeConfirmar = souDono || pedidoAutomatico;

            if (p.categoria === 'peca' && !souDono && !foiDirecionado && !isEstoqueNivel1) return;

            const catMap = { produtos: 'Produtos', peca: 'Peças' };
            const nomeCat = catMap[p.categoria] || p.categoria;

            const card = document.createElement('div');
            card.className = `card-pedido ${urgencia}`;
            card.dataset.cat = p.categoria;
            card.dataset.id = p.firebaseUrl || '';

            card.innerHTML = `
                <div class="card-accent accent-${p.categoria}"></div>
                <div class="card-corpo">
                    <div class="card-topo">
                        <div class="badges-col">
                            <span class="badge-cat badge-${p.categoria}">${nomeCat}</span>
                            ${p.categoria === 'peca' && p.direcionadoPara && isEstoqueNivel1 ? `<span class="responsavel-estoque">A/C: ${p.direcionadoPara}</span>` : ''}
                        </div>
                        <div class="desc-item">${p.descricao}</div>
                        ${p.categoria === 'peca' && p.direcionadoPara && !isEstoqueNivel1 ? `<div class="card-direcionamento"><span>A/C:</span><strong>${p.direcionadoPara}</strong></div>` : ''}
                    </div>
                    <div class="card-rodape">
                        <div class="card-meta">
                            <span class="nome-sol">${p.solicitante}</span>
                            <span class="meta-separador" aria-hidden="true">·</span>
                            <span class="badge-tempo ${tempo.cls}">${tempo.txt}</span>
                        </div>
                        ${(souDono || podeConfirmar || isGestor) ? `
                        <div class="card-acoes" aria-label="Ações do pedido">
                            ${souDono ? `<button class="btn-acao ativo-editar" title="Editar pedido" aria-label="Editar pedido" onclick='editarPedido(${JSON.stringify(p).replace(/'/g,"&#39;")})'><svg class="icone-acao" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></button>` : ''}
                            ${podeConfirmar ? `<button class="btn-acao ativo-confirmar" title="Confirmar recebimento" aria-label="Confirmar recebimento" onclick="confirmarCompra('${p.firebaseUrl}')"><span class="icone-confirmar" aria-hidden="true">✓</span></button>` : ''}
                            ${isGestor ? `<button class="btn-excluir" title="Excluir pedido" aria-label="Excluir pedido" onclick="excluirPedido('${p.firebaseUrl}')"><span class="icone-lixeira" aria-hidden="true">🗑️</span></button>` : ''}
                        </div>` : ''}
                    </div>
                </div>`;

            container.appendChild(card);
            totalCardsRenderizados += 1;
            if (
                pedidoRecemSalvo &&
                p.solicitante === pedidoRecemSalvo.solicitante &&
                p.categoria === pedidoRecemSalvo.categoria &&
                p.descricao === pedidoRecemSalvo.descricao &&
                p.data === pedidoRecemSalvo.data
            ) {
                cardRecemSalvo = card;
            }
        });

        if (totalCardsRenderizados === 0) {
            container.innerHTML = `
                <div class="estado-vazio">
                    <div class="icone-vazio">📭</div>
                    <p>Nenhum pedido de peças direcionado a você.</p>
                </div>`;
            return;
        }

        aplicarFiltroCategoria();
        if (cardRecemSalvo) {
            setTimeout(() => {
                cardRecemSalvo.classList.add('destacar-salvo');
                cardRecemSalvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => cardRecemSalvo.classList.remove('destacar-salvo'), 2200);
                pedidoRecemSalvo = null;
            }, 80);
        }
    });

    // 2. SALVAR PEDIDO
    window.salvarPedido = async function() {
        const id   = document.getElementById('idPedido').value;
        const desc = document.getElementById('descPedido').value.trim();
        if (!desc) { await window.playAlert('Digite o que precisa comprar.'); return; }
        if (!catAtual) { await window.playAlert('Selecione a categoria do pedido.'); return; }

        const dataPedido = new Date().toISOString();
        const categoriaPedido = catAtual;
        const responsavelPedido = document.getElementById('direcionadoPara').value;
        if (categoriaPedido === 'peca' && !responsavelPedido) {
            await window.playAlert('Selecione quem ficará aos cuidados deste pedido.');
            return;
        }
        const pedido = {
            descricao:   desc,
            categoria:   categoriaPedido,
            solicitante: usuarioLogado,
            data:        dataPedido
        };
        if (categoriaPedido === 'peca') pedido.direcionadoPara = responsavelPedido;

        if (!id) pedidoRecemSalvo = pedido;
        await dbSalvarPedido(pedido, id);

        document.getElementById('idPedido').value          = '';
        document.getElementById('descPedido').value        = '';
        document.getElementById('direcionadoPara').value    = '';
        document.getElementById('btnEnviar').innerText      = 'ENVIAR';
        document.getElementById('btnCancelar').style.display = 'none';
        document.querySelector('.form-fixo-titulo').textContent = 'Novo Pedido';
        selecionarCat(categoriaPedido);
    };

    // 3. EDITAR PEDIDO
    window.editarPedido = function(p) {
        document.getElementById('idPedido').value   = p.firebaseUrl;
        document.getElementById('descPedido').value = p.descricao;
        selecionarCat(p.categoria);
        document.getElementById('direcionadoPara').value = p.direcionadoPara || '';
        atualizarEstadoBotaoEnviar();
        document.getElementById('btnEnviar').innerText      = 'SALVAR';
        document.getElementById('btnCancelar').style.display = 'block';
        document.querySelector('.form-fixo-titulo').textContent = 'Editando Pedido';
        document.getElementById('descPedido').focus();
    };

    // 4. CANCELAR EDIÇÃO
    window.cancelarEdicao = function() {
        document.getElementById('idPedido').value          = '';
        document.getElementById('descPedido').value        = '';
        document.getElementById('direcionadoPara').value    = '';
        document.getElementById('btnEnviar').innerText      = 'ENVIAR';
        document.getElementById('btnCancelar').style.display = 'none';
        document.querySelector('.form-fixo-titulo').textContent = 'Novo Pedido';
        selecionarCat('peca');
    };

    // 5. CONFIRMAR COMPRA
    window.confirmarCompra = async function(id) {
        if (await window.playConfirm('Confirmar que este item foi comprado e recebido? Ele sairá da lista.')) {
            await dbExcluirPedido(id);
        }
    };

    // 6. EXCLUIR PEDIDO (gestor)
    window.excluirPedido = async function(id) {
        if (await window.playConfirm('Excluir este pedido da lista?')) {
            await dbExcluirPedido(id);
        }
    };

    selecionarCat('peca');

</script>
</body>
</html>
