<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="/pwa-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f2a66">
    <title>Localização</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="./localizacao.css">
</head>
<body style="visibility:hidden">
    <main class="app" id="appLocalizacao" hidden>
        <header class="topo">
            <div class="topo-espaco" aria-hidden="true"></div>
            <div class="titulo-wrap">
                <img src="assets/img/logomenor.png" alt="Play Diversões" class="logo">
                <h1>Localização</h1>
            </div>
            <button class="btn-home" type="button" id="btnHome" aria-label="Ir para a página inicial" title="Início">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
                </svg>
            </button>
        </header>

        <p class="subtitulo">Duas últimas localizações solicitadas de cada operador</p>

        <section class="estado" id="estadoCarregando" aria-live="polite">
            Carregando operadores...
        </section>
        <section class="estado estado-erro" id="estadoErro" hidden aria-live="assertive"></section>
        <section class="estado" id="estadoVazio" hidden>Nenhum operador encontrado.</section>
        <section class="lista-operadores" id="listaOperadores" aria-label="Operadores"></section>

        <button class="btn-carregar" type="button" id="btnCarregarMais" hidden>Carregar mais</button>
    </main>

    <script type="module" src="./localizacao.js"></script>
</body>
</html>
